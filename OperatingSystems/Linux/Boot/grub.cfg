menuentry "ARM64 Linux (Switch DTB + initramfs)" --id winx-linux {
    # Use the distro's compatible kernel, initramfs, root= and SKU-specific DTB.
    search --no-floppy --fs-uuid --set=linux_esp REPLACE_WITH_ESP_UUID
    set root=($linux_esp)
    devicetree /EFI/Linux/switch-board.dtb
    linux /EFI/Linux/Image root=PARTUUID=REPLACE_WITH_LINUX_ROOT_PARTUUID rootwait rw console=tty0 loglevel=7
    initrd /EFI/Linux/initramfs.img
}
